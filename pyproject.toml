[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "Multi-agent RAG over enterprise documents and structured data, built with LangGraph and Gemini."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI's Depends()/File() in parameter defaults is the framework idiom.
ignore = ["B008", "SIM905"]
